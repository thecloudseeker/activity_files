name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      
      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603
      
      - name: Install dependencies
        run: dart pub get
      
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      
      - name: Analyze project source
        run: dart analyze
      
      - name: Run tests with coverage
        run: dart test --coverage=coverage
      
      - name: Format coverage
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --packages=.dart_tool/package_config.json --report-on=lib
      
      - name: Upload coverage to Codecov
        if: ${{ hashFiles('coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true

  tag-release:
    name: Tag release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # RELEASE_TOKEN is a PAT with `contents: write` on this repo, stored as
      # a repo secret — not the default GITHUB_TOKEN. GitHub suppresses other
      # workflows from being triggered by GITHUB_TOKEN-authored pushes, so a
      # tag pushed that way would never fire publish.yml's `on: push: tags:`
      # listener below. Separately, pub.dev's trusted-publisher check requires
      # the *publishing* workflow run itself to have been triggered by an
      # actual tag ref (ref_type == 'tag') — calling the publish workflow
      # directly from this branch-triggered run doesn't satisfy that, so
      # publishing has to happen via publish.yml's own tag-triggered run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Read pubspec version
        id: version
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Idempotent: a push to main whose version already has a tag (e.g. a
      # docs-only follow-up commit) just skips instead of failing.
      - name: Create and push tag if missing
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi

      # The release body is the CHANGELOG section for this version, verbatim:
      # everything between `## X.Y.Z` and the next `## ` heading, which is
      # exactly how every release from v0.6.0 on was written by hand. Failing
      # loudly on a missing section is deliberate — a version bump with no
      # CHANGELOG entry should stop the release, not produce an empty one.
      - name: Extract changelog section
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="## $VERSION" '
            $0 == ver { found = 1; next }
            found && /^## / { exit }
            found { buf = buf $0 "\n" }
            END { sub(/^\n+/, "", buf); sub(/\n+$/, "\n", buf); printf "%s", buf }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section. Refusing to create an empty release."
            exit 1
          fi
          echo "Release notes ($(wc -l < release_notes.md) lines):"
          cat release_notes.md

      # Idempotent like the tag step, and independent of it: when the tag
      # already exists but the release does not, this still creates the
      # release. RELEASE_TOKEN rather than GITHUB_TOKEN for the same reason as
      # above — a release created by GITHUB_TOKEN cannot trigger an
      # `on: release` workflow, which would silently break any future listener.
      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          ARGS=(--title "$TAG" --notes-file release_notes.md)
          # A pre-release suffix (0.9.0-beta.1) must not become "Latest".
          case "$VERSION" in
            *-*) ARGS+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${ARGS[@]}"
